<style>
:root{--ink:#1F2D47;--bg:#F6F7F9;--card:#fff;--aqua:#DDA52E;--aquad:#8A6410;--aqual:#FBF2D9;--ok:#2E9E6B;--warn:#C98A00;--bad:#D2493B;--line:#DDE1E8;--mute:#5E6A80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:17px;line-height:1.35}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px 24px}

h2{font-size:20px;margin:22px 0 10px;font-weight:800}
h3{font-size:17px;margin:0;font-weight:700}
p{margin:6px 0}
.hero{background:var(--ink);color:#fff;margin:0 -16px 16px;padding:calc(22px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 26px 26px;text-align:center;border-bottom:5px solid var(--aqua)}
.hero h1{font-size:25px}
.hero small{color:#C3CBDC;display:block;margin-top:6px;font-size:15px}
.logo{width:132px;height:132px;display:block;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 4px rgba(221,165,46,.35)}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:#2C3D5E;color:#DDE3F0;margin-top:12px;border:0;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--bad)}.chip.on i{background:#4be29a}.chip.err i{background:#F2B705}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.warn{background:#FFF7E0;border-color:#F0D9A0}.card.info{background:var(--aqual);border-color:#EBD9A0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:800;background:var(--ink);color:#fff;margin:10px 0;text-align:center;cursor:pointer}
.btn:active{background:#121c30}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:700}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;margin:4px 6px 4px 0;font-size:15px}
.btn:disabled{opacity:.5}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.row:focus-visible{outline:3px solid var(--aqua);outline-offset:1px}
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.back{border:0;background:#fff;border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:22px;color:var(--ink);flex:none}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:15px;margin:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.row .box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #9DB6BC;display:grid;place-items:center;color:transparent;font-weight:900}
.row.on{background:var(--aqual);border-color:var(--aqua)}
.row.on .box{background:var(--ink);border-color:var(--ink);color:#fff}
.row.on span:last-child{color:#5E6A80;text-decoration:line-through;text-decoration-color:#B8A56A}
.area{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;cursor:pointer}
.area b{display:flex;justify-content:space-between;gap:8px}
.area.hl{border-color:var(--aqua);background:var(--aqual)}
.bar{height:8px;background:#E6E9F0;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--aqua);border-radius:9px}
.bar.full i{background:var(--ok)}
.ringwrap{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0}
.ring{position:relative;width:84px;height:84px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px 4px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}.seg button.on.poco{background:#F2B705;border-color:#F2B705;color:#222}.seg button.on.agotado{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.sel,.seg button.on.st-pendiente{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on.st-proceso{background:#F2B705;border-color:#F2B705;color:#222}.seg button.on.st-hecha{background:var(--ok);border-color:var(--ok);color:#fff}
.badge{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#FBE3A0;color:#6B4D05;white-space:nowrap}.badge.sent{background:#D3F2E2;color:#146B43}.badge.draft{background:#E6E9F0;color:var(--mute)}.badge.urg{background:#F8D3CE;color:#8E2418}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:7px;vertical-align:middle}
.photos{display:flex;gap:8px;flex-wrap:wrap}.photos div{position:relative}.photos img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photos button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:900}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav:empty{display:none}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--mute);padding:8px 0;border-radius:12px;position:relative}.nav button.on{color:var(--ink);background:var(--aqual)}
.nav svg{display:block;margin:0 auto 2px}
.nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 4px}
.mute{color:var(--mute);font-size:15px}.sm{font-size:14px}
.line{display:flex;gap:8px;align-items:center;margin:6px 0}.line input,.line select{flex:1;min-width:0}.line .x{flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--bad);font-size:20px;font-weight:800}
.line input.q{flex:0 0 86px}.line input.v{flex:0 0 128px}
.tot{display:flex;justify-content:space-between;margin:4px 0}.tot.big{font-size:19px;font-weight:800;border-top:1px solid #EBD9A0;padding-top:8px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin:18px 0}.chk input{width:22px;height:22px;flex:none}
.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:26px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;z-index:9;font-weight:600;text-align:center}
ul.pl{margin:6px 0;padding-left:20px}ul.pl li{margin:3px 0;font-size:15px}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.dots span.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.key{font:inherit;font-size:26px;font-weight:700;padding:18px 0;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.key:active{background:var(--aqual);border-color:var(--aqua)}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script>
const KEY='aseoAirbnb.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const MAILS='feristays@gmail.com, ericasierraq@gmail.com, lufergo8813@gmail.com';
const TYPES=['Salida de huéspedes','Limpieza profunda','Revisión rápida'];

/* ---------- claves (SHA-256, igual en todos los celulares) ---------- */
function sha256(a){
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)),mw=2**32;let res='',w=[],L=a.length*8,H=[],K=[],pl=0;const ic={};
  for(let c=2;pl<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;H[pl]=(c**.5*mw)|0;K[pl++]=(c**(1/3)*mw)|0}}
  a+='\x80';while(a.length%64-56)a+='\x00';
  for(let i=0;i<a.length;i++){const j=a.charCodeAt(i);if(j>>8)return'';w[i>>2]|=j<<((3-i)%4)*8}
  w[w.length]=(L/mw)|0;w[w.length]=L;let h=H.slice(0,8);
  for(let j=0;j<w.length;){const x=w.slice(j,j+=16),o=h;h=h.slice(0,8);
    for(let i=0;i<64;i++){const a0=h[0],e=h[4],x15=x[i-15],x2=x[i-2];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(x[i]=i<16?x[i]:(x[i-16]+(rr(x15,7)^rr(x15,18)^(x15>>>3))+x[i-7]+(rr(x2,17)^rr(x2,19)^(x2>>>10)))|0);
      const t2=(rr(a0,2)^rr(a0,13)^rr(a0,22))+((a0&h[1])^(a0&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(h[i]>>(j*8))&255;res+=(b<16?'0':'')+b.toString(16)}
  return res;
}
const ph=(id,pin)=>sha256('aseo|'+id+'|'+pin);

function defaults(){
  const A=(n,items)=>({id:uid(),name:n,items:items.map(t=>({id:uid(),text:t}))});
  return{fresh:1,
    settings:{props:['La Buena Mesa','Corazón Envigado','Kiwi Apartamentos','Gascuña'],cleaners:['Ayarith'],mstaff:[],email:MAILS,url:'',last:{},pin:'8888'},
    template:[
      A('Entrada y sala',['Sacar basura y reciclaje','Sacudir muebles y superficies','Aspirar y trapear el piso','Limpiar espejos y vidrios','Acomodar cojines y control remoto']),
      A('Cocina',['Lavar y guardar la loza','Limpiar estufa y mesón','Limpiar la nevera por dentro (retirar comida olvidada)','Limpiar el microondas','Vaciar y lavar la caneca','Trapear el piso']),
      A('Habitaciones',['Cambiar sábanas y fundas','Revisar bajo la cama y mesas de noche','Revisar que el colchón y el protector no tengan manchas','Sacudir y aspirar','Revisar el clóset (objetos olvidados)']),
      A('Baños',['Desinfectar el sanitario','Limpiar ducha y paredes','Dejar lavamanos y grifería brillantes','Cambiar toallas','Reponer papel higiénico y jabón','Quitar cabellos del desagüe','Limpiar el espejo y trapear']),
      A('Balcón y lavandería',['Barrer y limpiar el balcón','Poner a lavar la ropa sucia','Guardar la ropa de cama limpia']),
      A('Revisión final',['Luces y electrodomésticos apagados','Ventanas y puertas cerradas','Ventilar y dejar buen aroma','Llaves o cerradura en su sitio'])
    ],
    supplies:['Papel higiénico','Jabón de manos','Shampoo y acondicionador','Toallas','Sábanas de repuesto','Bolsas de basura','Café y azúcar','Detergente y desinfectante','Esponjas'].map(n=>({id:uid(),name:n})),
    reports:[],draft:null
  };
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.template){if(!d.settings.email)d.settings.email=MAILS;if(!d.v2){d.v2=1;if(d.settings.props.length===1&&d.settings.props[0]==='Apartamento 1')d.settings.props=defaults().settings.props;if(!d.settings.cleaners.includes('Ayarith'))d.settings.cleaners.unshift('Ayarith')}return d}}catch(e){}return defaults()}
/* Migración a la versión con usuarios, tareas y sincronización (no borra datos anteriores) */
function migrate(){
  S.mreports=S.mreports||[];S.bikelogs=S.bikelogs||[];S.bikes=S.bikes||['Bici 1','Bici 2'];S.settings.mstaff=S.settings.mstaff||[];
  if(S.v3)return;
  const st=S.settings,pin=st.pin||'8888',u0=S.fresh?0:1,slugN=n=>'u-'+n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  S.users=S.users||[{id:'adm1',name:'Administradora 1',role:'admin',pin:ph('adm1',pin),_u:0},{id:'adm2',name:'Administradora 2',role:'admin',pin:ph('adm2',pin),_u:0}];
  const addU=(n,role)=>{n=(n||'').trim();if(!n)return;const id=slugN(n);if(!S.users.some(u=>u.id===id))S.users.push({id,name:n,role,pin:'',_u:u0})};
  (st.cleaners||[]).forEach(n=>addU(n,'aseo'));(st.mstaff||[]).forEach(n=>addU(n,'mant'));
  S.tasks=S.tasks||[];S.work=S.work||[];
  (S.pend||[]).forEach(t=>{
    S.tasks.push({id:t.id,kind:'mant',to:'rol:mant',prop:t.prop||'',title:t.text,detail:'',due:'',prio:'normal',budget:t.price||'',by:'adm1',at:t.date||Date.now(),_u:1});
    if(t.done)S.work.push({id:t.id,status:'hecha',note:'',mats:[],labor:[],doneBy:'',doneName:t.doneBy||'',doneAt:t.doneAt||Date.now(),_u:1});
  });
  delete S.pend;
  S.sync=S.sync||{url:st.url||'',key:'',rev:0,out:{},last:0,err:''};
  S.cfgU=S.cfgU||{main:u0,template:u0};S.seen=S.seen||{};S.me=S.me||null;
  delete S.fresh;S.v3=1;
}
let lastErrToast=0;
function save(){
  S.reports.forEach((r,i)=>{if(i>=10&&r.status==='sent'&&r.photos&&r.photos.length)r.photos=[]});
  S.reports=S.reports.slice(0,60);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(Date.now()-lastErrToast>5000){lastErrToast=Date.now();toast('Memoria llena: envía y borra reportes viejos')}}
  if(S.sync&&Object.keys(S.sync.out).length)later();
}
let S=load();migrate();
let V={n:'home'},awaiting=null,phTarget='general',pinBuf='';

/* ---------- usuarios y roles ---------- */
const ROLE={admin:'Administradora',aseo:'Aseo',mant:'Mantenimiento'};
const me=()=>S.me?S.users.find(u=>u.id===S.me.id)||null:null;
const adm=()=>{const u=me();return !!u&&u.role==='admin'};
const uName=id=>{const u=S.users.find(x=>x.id===id);return u?u.name:''};
const usersOf=r=>S.users.filter(u=>u.role===r);
const ADMIN=['hist','set','tasks','tnew','rep'];

/* ---------- tareas ---------- */
const TST={pendiente:'Pendiente',proceso:'En proceso',hecha:'Hecha'};
const toName=t=>t.to==='rol:aseo'?'Todo el personal de aseo':t.to==='rol:mant'?'Todo mantenimiento':(uName(t.to)||'(persona eliminada)');
const mine=t=>{const u=me();return !!u&&(t.to===u.id||t.to==='rol:'+u.role)};
const W=id=>S.work.find(w=>w.id===id);
const getW=id=>{let w=W(id);if(!w){w={id,status:'pendiente',note:'',mats:[],labor:[]};S.work.push(w)}w.mats=w.mats||[];w.labor=w.labor||[];return w};
const tst=t=>(W(t.id)||{}).status||'pendiente';
const num=v=>+String(v??'').replace(/\D/g,'')||0;
const qty=v=>{if(v===''||v==null)return 1;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const sub=m=>Math.round(qty(m.q)*num(m.p));
const costs=w=>{const m=(w&&w.mats||[]).reduce((a,x)=>a+sub(x),0),l=(w&&w.labor||[]).reduce((a,x)=>a+num(x.v),0);return{m,l,t:m+l}};
const money=n=>'$'+Math.round(n).toLocaleString('es-CO');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{const[y,m,d]=String(s).split('-').map(Number);return y?new Date(y,m-1,d).toLocaleDateString('es-CO',{day:'2-digit',month:'short'}):''};
const isLate=t=>t.due&&t.due<today()&&tst(t)!=='hecha';
const tsort=(a,b)=>{const da=tst(a)==='hecha',db=tst(b)==='hecha';if(da!==db)return da?1:-1;if(da)return((W(b.id)||{}).doneAt||0)-((W(a.id)||{}).doneAt||0);
  const ua=a.prio==='urgente',ub=b.prio==='urgente';if(ua!==ub)return ua?-1:1;if((a.due||'9')!==(b.due||'9'))return(a.due||'9')<(b.due||'9')?-1:1;return(b.at||0)-(a.at||0)};
const myOpen=()=>S.tasks.filter(t=>mine(t)&&tst(t)!=='hecha');
const unseen=()=>myOpen().filter(t=>!S.seen[t.id]).length;
/* tareas adicionales de aseo que aplican a una limpieza */
const extraFor=r=>S.tasks.filter(t=>t.kind==='aseo'&&(!t.prop||t.prop===r.property)&&(adm()?(t.to==='rol:aseo'||uName(t.to)===r.cleaner||t.to===S.me.id):mine(t))&&(tst(t)!=='hecha'||(r.xdone||{})[t.id])).sort(tsort);

/* ---------- sincronización con el servidor (Google Apps Script + Hoja de Google) ---------- */
const LIST={users:()=>S.users,tasks:()=>S.tasks,work:()=>S.work,reports:()=>S.reports,mreports:()=>S.mreports,bikelogs:()=>S.bikelogs};
const STRIP={
  reports:r=>{const o={...r};o.nPh=(r.photos||[]).length;delete o.photos;return o},
  mreports:r=>({...r,items:(r.items||[]).map(i=>({...i,photos:[]}))}),
  bikelogs:r=>{const o={...r};o.nPh=(r.photos||[]).length;o.photos=[];o.sig='';return o}
};
const MERGE={
  reports:(l,d)=>({...d,photos:l&&l.photos||[]}),
  mreports:(l,d)=>({...d,items:(d.items||[]).map(i=>({...i,photos:((l&&l.items||[]).find(x=>x.id===i.id)||{}).photos||[]}))}),
  bikelogs:(l,d)=>({...d,photos:l&&l.photos&&l.photos.length?l.photos:[],sig:l&&l.sig||''})
};
const SORT={reports:(a,b)=>b.start-a.start,mreports:(a,b)=>b.start-a.start,bikelogs:(a,b)=>b.date-a.date,tasks:(a,b)=>(b.at||0)-(a.at||0)};
function touch(col,r){r._u=Date.now();S.sync.out[col+'|'+r.id]=r._u}
function gone(col,id){S.sync.out[col+'|'+id]=Date.now()}
function touchCfg(id){S.cfgU[id]=Date.now();S.sync.out['cfg|'+id]=S.cfgU[id]}
function enqueueAll(){
  Object.keys(LIST).forEach(c=>LIST[c]().forEach(r=>{if(r&&r.id)S.sync.out[c+'|'+r.id]=r._u||0}));
  S.sync.out['cfg|main']=S.cfgU.main||0;S.sync.out['cfg|template']=S.cfgU.template||0;
}
function outRec(c,id){
  if(c==='cfg'){const u=S.cfgU[id]||0;return{u,d:id==='main'?{props:S.settings.props,supplies:S.supplies,bikes:S.bikes,email:S.settings.email}:{template:S.template}}}
  const r=(LIST[c]?LIST[c]():[]).find(x=>x.id===id);
  if(!r)return{u:S.sync.out[c+'|'+id]||Date.now(),x:1};
  const d=(STRIP[c]||(x=>({...x})))(r);delete d._u;return{u:r._u||0,d};
}
function localU(c,id){
  if(c==='cfg')return S.cfgU[id]||0;
  const r=LIST[c]().find(x=>x.id===id);if(r)return r._u||0;
  const k=c+'|'+id;return k in S.sync.out?S.sync.out[k]:-1;
}
function applyIn(ch){
  const{c,i,u}=ch,k=c+'|'+i;if(c!=='cfg'&&!LIST[c])return false;
  const lu=localU(c,i);

function render(){
  if(!me()&&V.n!=='login'&&V.n!=='pin')V={n:'login'};
  const el=$('#app'),y=scrollY,keep=V.keep;V.keep=false;needRender=false;
  const h=VIEWS[V.n]();

function login(u){
  const prev=S.lastUser;S.me={id:u.id,keep:S.keepPref!==false};S.lastUser=u.id;
  if(prev&&prev!==u.id)S.sync.rev=0;            // otra persona: volver a traer todo lo que le corresponde
  prevUnseen=-1;save();go('home');syncNow();
}

  if(t.id==='f-cl'&&t.tagName==='SELECT'){$('#f-cl2').style.display=t.value==='__o'?'block':'none'}
  if(t.id==='keep')S.keepPref=t.checked;

  if(t.dataset.s){const[k,i]=t.dataset.s.split(':');const v=t.value.trim();
    if(k==='url'||k==='key'){if(S.sync[k]!==v){S.sync[k]=v;S.sync.rev=0;S.sync.err='';enqueueAll();save();if(connected())syncNow(true)}return}
    if(k==='email')S.settings.email=v;
    else if(k==='P')S.settings.props[+i]=v;else if(k==='S')S.supplies[+i].name=v;
    S.settings.props=S.settings.props.filter(Boolean);cfgMain();save()}
  if(t.dataset.t){const p=t.dataset.t.split(':');const a=S.template.find(x=>x.id===p[1]);
    if(p[0]==='a')a.name=t.value.trim()||a.name;else{const it=a.items.find(x=>x.id===p[2]);it.text=t.value.trim()||it.text}cfgTpl();save()}
  if(t.dataset.u){const[id,f]=t.dataset.u.split(':'),u=S.users.find(x=>x.id===id);if(!u)return;

    touch('users',u);save();if(!adm())go('home');else{V.keep=true;render()}}
});

function mkPDF(items){
  const W=595,H=842,M=50,P=[[]],I=[];let y=H-64;const np=()=>{P.push([]);y=H-64},cur=()=>P[P.length-1];
  items.forEach(it=>{
    if(it.img){let w=Math.min(220,it.w),hh=w*it.h/it.w;if(hh>190){hh=190;w=hh*it.w/it.h}if(y-hh<60)np();y-=hh;I.push({b:atob(it.img.split(',')[1]),w:it.w,h:it.h});cur().push('q '+w.toFixed(0)+' 0 0 '+hh.toFixed(0)+' '+M+' '+y.toFixed(0)+' cm /I'+I.length+' Do Q');y-=10;return}
    const fs=it.s||10,mc=Math.floor((W-2*M)/(fs*(it.b?.57:.53)));let cl='';const ls=[];
    lat(it.t).split(/\s+/).forEach(w=>{if((cl+' '+w).trim().length>mc){ls.push(cl);cl=w}else cl=(cl+' '+w).trim()});ls.push(cl);y-=it.g||0;
    ls.forEach(l=>{if(y-fs*1.45<55)np();y-=fs*1.45;cur().push('BT /F'+(it.b?2:1)+' '+fs+' Tf '+(it.c||'0.1 0.1 0.15')+' rg '+M+' '+y.toFixed(0)+' Td ('+pe(l)+') Tj ET')});
  });
  const n=P.length,k=I.length;let o='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const of=[];const add=(id,b)=>{of[id]=o.length;o+=id+' 0 obj\n'+b+'\nendobj\n'};
  add(1,'<< /Type /Catalog /Pages 2 0 R >>');add(2,'<< /Type /Pages /Kids ['+P.map((_,i)=>(6+k+2*i)+' 0 R').join(' ')+'] /Count '+n+' >>');
  add(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

    add(5+k+2*i,'<< /Length '+s.length+' >>\nstream\n'+s+'endstream');add(6+k+2*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << '+xo+' >> >> /Contents '+(5+k+2*i)+' 0 R >>')});

const NV='0.12 0.18 0.28',GD='0.54 0.39 0.06';
function mnPDF(r){const L=[{t:'Reporte de mantenimiento',s:17,b:1,c:NV},{t:'Feri Stays',s:11,b:1,c:GD,g:2},{t:'Propiedad: '+r.prop,s:12,b:1,g:8},{t:'Realizado por: '+r.who,s:11},{t:'Fecha: '+fmt(r.start)+'  -  '+fmt(r.end),s:10}];
  let gt=0;
  r.items.forEach((i,n)=>{L.push({t:(n+1)+'. '+i.text,s:12,b:1,c:NV,g:14});if(i.detail)L.push({t:i.detail,s:10,g:3});
    const w=i.task&&W(i.task);
    if(w&&((w.mats||[]).length||(w.labor||[]).length)){const c=costs(w);gt+=c.t;
      (w.mats||[]).forEach(m=>L.push({t:'Material: '+(m.d||'')+'  x'+(m.q||1)+'  a '+money(num(m.p))+'  = '+money(sub(m)),s:10,g:2}));
      (w.labor||[]).forEach(l=>L.push({t:'Mano de obra: '+(l.d||'')+'  '+money(num(l.v)),s:10,g:2}));
      L.push({t:'Total de este trabajo: '+money(c.t),s:10,b:1,g:2})}
    (i.photos||[]).forEach(p=>L.push({img:p.d,w:p.w,h:p.h}))});
  if(gt)L.push({t:'TOTAL MATERIALES Y MANO DE OBRA: '+money(gt),s:12,b:1,c:NV,g:16});
  return mkPDF(L)}
function bkPDF(r){const L=[{t:'Registro de mantenimiento de bicicleta',s:17,b:1,c:NV},{t:'Feri Stays',s:11,b:1,c:GD,g:2},{t:'Bicicleta: '+r.bike,s:12,b:1,g:8},{t:'Fecha: '+fmt(r.date),s:10},{t:'Trabajo realizado',s:12,b:1,c:NV,g:12},{t:r.detail,s:10,g:3}];
  (r.photos||[]).forEach(p=>L.push({img:p.d,w:p.w,h:p.h}));L.push({t:'Mecanico responsable',s:12,b:1,c:NV,g:14},{t:r.mech+'  -  '+r.dt+' '+r.dn,s:10,b:1});
  if(r.sig)L.push({img:r.sig,w:r.sw,h:r.sh});else L.push({t:'(La firma y las fotos quedaron guardadas en el celular donde se registró.)',s:9,g:4});
  return mkPDF(L)}
async function sendDoc(nm,str,subj,sum){
  const by=new Uint8Array(str.length);for(let i=0;i<str.length;i++)by[i]=str.charCodeAt(i);const to=(S.settings.email||'').split(/[,;\s]+/).filter(Boolean);
  if(S.sync.url&&navigator.onLine){try{await fetch(S.sync.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({tipo:'documento',asunto:subj,resumen:sum,fileName:nm,pdfBase64:btoa(str),recipients:to})});toast('Enviado por correo');return}catch(e){}}
  const f=new File([by],nm,{type:'application/pdf'});
  try{if(navigator.clipboard)navigator.clipboard.writeText(to.join(', ')).catch(()=>{});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:subj,text:'Para: '+to.join(', ')+'\n'+sum});toast('Compartido. Pega los correos en “Para”.');return}}catch(e){if(e.name==='AbortError')return}
  dl(nm,by,'application/pdf');toast('PDF descargado: adjúntalo a tu correo');
}
const mI=id=>S.mdraft.items.find(x=>x.id===id),nI=()=>({id:uid(),text:'',detail:'',photos:[],price:''});
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function vMn(){
  const d=S.mdraft,s=S.settings,u=me(),ms=usersOf('mant').map(x=>x.name);
  if(!d)return hdr('Mantenimiento','home')+`<label for="m-pr">Propiedad</label><select id="m-pr">${opt(s.props)}</select><label for="m-who">Quién hace el mantenimiento</label>${u.role==='mant'?`<input id="m-who" value="${esc(u.name)}" readonly>`:ms.length?`<select id="m-who">${opt(ms)}</select>`:'<input id="m-who" placeholder="Nombre completo">'}<button class="btn" data-a="mbegin">Empezar</button>`;
  const pd=S.tasks.filter(t=>t.kind==='mant'&&(!t.prop||t.prop===d.prop)&&tst(t)!=='hecha'&&(adm()||mine(t))&&!d.items.some(i=>i.task===t.id));
  return hdr(esc(d.prop),'home')+`<p class="mute">${esc(d.who)} · ${fmt(d.start)}</p>`+d.items.map((i,n)=>`<div class="card"><b>Trabajo ${n+1}</b><label>¿Qué se hizo?</label><input data-m="${i.id}:text" value="${esc(i.text)}"><label>Detalle</label><textarea data-m="${i.id}:detail">${esc(i.detail)}</textarea>${adm()?`<label>Precio (solo las administradoras lo ven)</label><input inputmode="numeric" data-m="${i.id}:price" value="${esc(i.price||'')}">`:''}${i.task?`<button class="btn sm sec" data-a="task" data-id="${i.task}">Materiales y mano de obra${W(i.task)&&costs(W(i.task)).t?' · '+money(costs(W(i.task)).t):''}</button>`:''}${imgs(i.photos,'mdp',i.id)}<button class="btn sm sec" data-a="mph" data-id="${i.id}">Foto</button><button class="btn sm ghost" data-a="mdel" data-id="${i.id}">Quitar</button></div>`).join('')+
  `<button class="btn sec" data-a="madd">+ Agregar otro trabajo</button>`+(pd.length?'<h2>Pendientes de esta propiedad</h2><p class="mute sm">Toca uno para agregarlo a este reporte.</p>'+pd.map(t=>`<button class="area" data-a="mtask" data-id="${t.id}">+ ${esc(t.title)}</button>`).join(''):'')+`<button class="btn" data-a="mfin">Terminar y enviar reporte</button><button class="btn ghost" data-a="mdisc">Descartar</button>`;
}
function vBk(){
  const o=S.bkd||(S.bkd={bike:S.bikes[0]||'',mech:'',dt:'Cédula de ciudadanía',dn:'',detail:'',photos:[],sig:''});
  return hdr('Mantenimiento de bicicleta','home')+`<label>Bicicleta</label><select data-k="bike">${opt(S.bikes,o.bike)}</select><label>Qué se cambió, ajustó o adecuó</label><textarea data-k="detail" placeholder="Ej: cambio de pastillas de freno, ajuste de cadena">${esc(o.detail)}</textarea><h2>Fotos de evidencia</h2>${imgs(o.photos,'bdp')}<button class="btn sec" data-a="bph">Tomar foto</button>
  <h2>Mecánico</h2><label>Nombre completo</label><input data-k="mech" value="${esc(o.mech)}"><label>Tipo de documento</label><select data-k="dt">${opt(['Cédula de ciudadanía','Cédula de extranjería','Pasaporte','Otro'],o.dt)}</select><label>Número de documento</label><input data-k="dn" value="${esc(o.dn)}">
  <label>Firma del mecánico</label><div style="border:2px dashed #9AA5BC;border-radius:14px;background:#fff"><canvas id="bsig" style="width:100%;height:160px;touch-action:none;display:block"></canvas></div><button class="btn sm ghost" data-a="bclr">Borrar firma</button><button class="btn" data-a="bfin">Guardar y enviar</button><button class="btn ghost" data-a="bdisc">Descartar</button>`;
}
function bkInit(){
  const c=$('#bsig');if(!c)return;const r=c.getBoundingClientRect(),dp=devicePixelRatio||1;c.width=r.width*dp;c.height=160*dp;const x=c.getContext('2d');x.setTransform(dp,0,0,dp,0,0);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#1F2D47';
  if(S.bkd.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,160);im.src=S.bkd.sig}
  let dr=false,l;const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}dr=true;l=p(e);x.beginPath();x.arc(l[0],l[1],1,0,6.3);x.stroke()};
  c.onpointermove=e=>{if(!dr)return;const q=p(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(q[0],q[1]);x.stroke();l=q};
  c.onpointerup=c.onpointercancel=()=>{if(!dr)return;dr=false;const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const g=t.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,t.width,t.height);g.drawImage(c,0,0);S.bkd.sig=t.toDataURL('image/jpeg',.9);S.bkd.sw=t.width;S.bkd.sh=t.height;save()};
}
const _vh=vHist,sumP=t=>(+String(t||0).replace(/\D/g,'')||0);
VIEWS.mn=vMn;VIEWS.bk=vBk;
VIEWS.hist=()=>_vh()+'<h2>Mantenimientos</h2>'+(S.mreports.length?S.mreports.map(r=>{const t=r.items.reduce((a,i)=>a+sumP(i.price),0),mc=r.items.reduce((a,i)=>a+(i.task&&W(i.task)?costs(W(i.task)).t:0),0);return `<div class="card"><b>${esc(r.prop)}</b> · ${fmt(r.start)}<br><span class="mute">${esc(r.who)} · ${r.items.length} trabajo(s)${t?' · precio $'+t.toLocaleString('es-CO'):''}${mc?' · materiales y mano de obra '+money(mc):''}</span><br><button class="btn sm sec" data-a="mre" data-id="${r.id}">Reenviar PDF</button></div>`}).join(''):'<p class="mute">Sin registros.</p>')+'<h2>Bicicletas</h2>'+(S.bikelogs.length?S.bikelogs.map(r=>`<div class="card"><b>${esc(r.bike)}</b> · ${fmt(r.date)}<br><span class="mute">${esc(r.mech)} · ${esc(r.dt)} ${esc(r.dn)}</span><br><button class="btn sm sec" data-a="bre" data-id="${r.id}">Reenviar PDF</button></div>`).join(''):'<p class="mute">Sin registros.</p>');
Object.assign(A,{
  mbegin(){const w=($('#m-who').value||'').trim();if(!w){toast('Escribe quién hace el mantenimiento');return}S.mdraft={id:uid(),by:me().id,prop:$('#m-pr').value,who:w,start:Date.now(),items:[nI()]};save();go('mn')},
  madd(){S.mdraft.items.push(nI());save();V.keep=true;render()},
  mdel(e){S.mdraft.items=S.mdraft.items.filter(i=>i.id!==e.dataset.id);if(!S.mdraft.items.length)S.mdraft.items.push(nI());save();V.keep=true;render()},
  mph(e){const i=mI(e.dataset.id);if(i.photos.length>=4){toast('Máximo 4 fotos por trabajo');return}pt=p=>i.photos.push(p);ph2.click()},
  mdp(e){mI(e.dataset.id).photos.splice(+e.dataset.i,1);save();V.keep=true;render()},
  mtask(e){const t=S.tasks.find(x=>x.id===e.dataset.id);const it=S.mdraft.items;if(it.length===1&&!it[0].text&&!it[0].photos.length)it.length=0;S.mdraft.items.push({id:uid(),text:t.title,detail:t.detail||'',photos:[],price:adm()?t.budget||'':'',task:t.id});save();V.keep=true;render()},
  mdisc(){if(confirm('¿Descartar este registro?')){S.mdraft=null;save();go('home')}},
  mfin(){const d=S.mdraft;d.items=d.items.filter(i=>i.text.trim());if(!d.items.length){toast('Escribe al menos un trabajo realizado');return}
    d.end=Date.now();d.status='pending';d.items.forEach(i=>{const t=S.tasks.find(x=>x.id===i.task);if(t){const w=getW(t.id);if(w.status!=='hecha'){w.status='hecha';w.doneBy=me().id;w.doneAt=d.end;touch('work',w)}}});
    S.mreports.unshift(d);touch('mreports',d);S.mreports.slice(8).forEach(r=>r.items.forEach(i=>i.photos=[]));S.mdraft=null;save();go('home');
    sendDoc('mantenimiento-'+d.prop.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+new Date(d.start).toISOString().slice(0,10)+'.pdf',mnPDF(d),'Reporte de mantenimiento - '+d.prop,'Mantenimiento en '+d.prop+' por '+d.who+' ('+d.items.length+' trabajo(s)).')},
  bph(){if(S.bkd.photos.length>=4){toast('Máximo 4 fotos');return}pt=p=>S.bkd.photos.push(p);ph2.click()},
  bdp(e){S.bkd.photos.splice(+e.dataset.i,1);save();V.keep=true;render()},
  bclr(){S.bkd.sig='';save();bkInit()},
  bdisc(){if(confirm('¿Descartar este registro?')){S.bkd=null;save();go('home')}},
  bfin(){const o=S.bkd;if(!o.detail.trim()||!o.mech.trim()||!o.dn.trim()){toast('Completa el detalle y los datos del mecánico');return}
    if(!o.photos.length){toast('Agrega al menos una foto de evidencia');return}if(!o.sig){toast('Falta la firma del mecánico');return}
    const r={...o,id:uid(),by:me().id,date:Date.now()};S.bikelogs.unshift(r);touch('bikelogs',r);S.bikelogs.slice(8).forEach(x=>{x.photos=[]});S.bkd=null;save();go('home');
    sendDoc('bicicleta-'+r.bike.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+new Date(r.date).toISOString().slice(0,10)+'.pdf',bkPDF(r),'Mantenimiento de bicicleta - '+r.bike,'Mantenimiento de '+r.bike+' por '+r.mech+' ('+r.dt+' '+r.dn+').')},
  mre(e){const r=S.mreports.find(x=>x.id===e.dataset.id);sendDoc('mantenimiento-'+new Date(r.start).toISOString().slice(0,10)+'.pdf',mnPDF(r),'Reporte de mantenimiento - '+r.prop,'Mantenimiento en '+r.prop+' por '+r.who+'.')},
  bre(e){const r=S.bikelogs.find(x=>x.id===e.dataset.id);sendDoc('bicicleta-'+new Date(r.date).toISOString().slice(0,10)+'.pdf',bkPDF(r),'Mantenimiento de bicicleta - '+r.bike,'Mantenimiento de '+r.bike+' por '+r.mech+'.')}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.m&&S.mdraft){const[id,f]=t.dataset.m.split(':');const i=mI(id);if(i){i[f]=t.value;save()}}
  if(t.dataset.k&&S.bkd){S.bkd[t.dataset.k]=t.value;save()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.x==='bikes'){S.bikes=t.value.split(',').map(x=>x.trim()).filter(Boolean);cfgMain();save()}});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
applyHash();
V={n:me()?'home':'login'};
render();autoUp();syncNow();
setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine&&!syncing)syncNow()},60000);
